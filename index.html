<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DW HC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: #090a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .panel {
      width: 100%;
      max-width: 400px;
      background: #11131a;
      border: 1px solid #1d212d;
      border-radius: 12px;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 14px;
      border-bottom: 1px solid #1d212d;
      margin-bottom: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .status-line {
      font-size: 13px;
      color: #64748b;
    }
    .status-text {
      font-weight: 600;
      color: #64748b;
    }
    .status-text.online {
      color: #10b981;
    }
    .status-text.offline {
      color: #ef4444;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #161922;
      border: 1px solid #202533;
      border-radius: 8px;
    }
    .player-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .char-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .player-name {
      font-size: 11px;
      color: #64748b;
    }
    .hearts {
      font-size: 16px;
      letter-spacing: 2px;
      user-select: none;
    }
    .empty {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 18px 0;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="title">DW HC</div>
      <div class="status-line">Status: <span id="statusText" class="status-text">Checking...</span></div>
    </div>

    <div id="playerList" class="player-list">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <script>
    const GIST_API = 'https://api.github.com/gists/232142008897e8e0d16703e99b7ec770';

    async function fetchStatus() {
      try {
        const res = await fetch(GIST_API + '?_t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const gist = await res.json();
          if (gist.files && gist.files['status.json'] && gist.files['status.json'].content) {
            return JSON.parse(gist.files['status.json'].content);
          }
        }
      } catch (err) {}
      const local = await fetch('status.json?_t=' + Date.now(), { cache: 'no-store' });
      return await local.json();
    }

    async function update() {
      try {
        const data = await fetchStatus();
        const textEl = document.getElementById('statusText');
        if (data.serverOnline) {
          textEl.className = 'status-text online';
          textEl.innerText = 'Online';
        } else {
          textEl.className = 'status-text offline';
          textEl.innerText = 'Offline';
        }

        const listEl = document.getElementById('playerList');
        const players = data.players || [];
        if (players.length > 0) {
          listEl.innerHTML = players.map(p => {
            return '<div class="player-row">' +
              '<div class="player-info">' +
                '<div class="char-name">' + (p.charName || 'Adventurer') + '</div>' +
                '<div class="player-name">' + (p.playerName || '') + '</div>' +
              '</div>' +
              '<div class="hearts">' + (p.hearts || '❤️❤️❤️') + '</div>' +
            '</div>';
          }).join('');
        } else {
          listEl.innerHTML = '<div class="empty">No players registered.</div>';
        }
      } catch (e) {}
    }

    update();
    setInterval(update, 5000);
  </script>
</body>
</html>
